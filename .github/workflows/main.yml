name: Build SuperMarket AlKhalifa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Check Project ZIP
        run: |
          if [ ! -f "SuperMarket_AlKhalifa_Android_Project.zip" ]; then
            echo "Project ZIP file not found!"
            exit 1
          fi

      - name: Extract Project
        run: |
          mkdir project
          unzip -q SuperMarket_AlKhalifa_Android_Project.zip -d project
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android Project
        run: |
          GRADLE_FILE=$(find project -name build.gradle -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarket-AlKhalifa-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
